<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1c42">
<meta charset="UTF-8">
<title>Advent Scriptures 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: "Georgia", serif;
        background: linear-gradient(to bottom, #0b1c42, #0f295f, #183b92);
        color: white;
        text-align: center;
        min-height: 100vh;

        /* Cursor (doesn't render on your system—kept for completeness) */
        cursor: auto;
    }

    h1 {
        margin-top: 30px;
        margin-bottom: 10px;
        font-size: 3rem;
        letter-spacing: 2px;
    }

    .intro-verse {
        font-size: 1.3rem;
        margin-bottom: 40px;
        font-style: italic;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
        padding: 0 20px;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        max-width: 900px;
        margin: 0 auto 60px auto;
        padding: 20px;
    }

    .day-box {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 20px;
        font-size: 1.3rem;
        cursor: pointer;
        transition: 0.3s;
        backdrop-filter: blur(3px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .day-box:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    /* Modal styling */
    .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0; top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.6);
    }
.modal-content {
    background: #fffdf8; /* warm, soft ivory */
    color: #3a2a1a;      /* warm chocolate-brown text */
    margin: 10% auto;
    padding: 25px 30px;
    border-radius: 12px;

    /* Elegant gold frame */
    border: 5px double #d4af37; /* metallic gold */
    
    /* Candlelight glow */
    box-shadow:
        0 0 25px rgba(212,175,55,0.5),
        0 0 10px rgba(0,0,0,0.2);

    width: 80%;
    max-width: 600px;
    font-size: 1.2rem;
    line-height: 1.55;

    /* Allow scrolling for long verses */
    max-height: 72vh;
    overflow-y: auto;
}


    .close {
        float: right;
        font-size: 2rem;
        cursor: pointer;
    }

    /* ✨ Sparkle Trail */
    .sparkle {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, #fff 0%, #ffd27f 40%, rgba(255,255,255,0) 70%);
        box-shadow: 0 0 8px rgba(255,255,255,0.9);
        animation: fadeOut 0.7s linear forwards;
        z-index: 9999;
    }

    @keyframes fadeOut {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.4); }
    }

    /* ✨ Advent Candles */
    .advent-candles {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-top: 40px;
        margin-bottom: 20px; /* leaves room for the footer */
        align-items: flex-end;
    }

    .candle {
        position: relative;
        width: 35px;
        height: 140px;
        border-radius: 10px;
        background: linear-gradient(to bottom, #7e3d9a, #4b2566);
        box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
    }

    .candle.pink {
        background: linear-gradient(to bottom, #ff8ac5, #b04a7a);
    }

    .candle::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 48px;
        height: 20px;
        background: inherit;
        border-radius: 50%;
        filter: brightness(1.3);
    }


    .flame {
    	position: absolute;
    	top: -35px;
    	left: 50%;
    	transform: translateX(-50%);
    	width: 20px;
    	height: 30px;
    	background: radial-gradient(ellipse at center, #fff6a9 0%, #ffd25a 45%, rgba(255,255,255,0) 70%);
    	animation: flicker 0.13s infinite alternate;
    	border-radius: 50% 50% 60% 60%;
    	filter: drop-shadow(0 0 10px #ffc241);
    	pointer-events: none;
    	display: none;          /* default hidden */
	}

     .flame.lit {
    	display: block;         /* show when lit */
      }


    @keyframes flicker {
        0% { transform: translateX(-50%) scale(0.95); opacity: 0.92; }
        100% { transform: translateX(-50%) scale(1.05); opacity: 1; }
    }

    footer {
        margin-bottom: 40px;
        font-size: 0.9rem;
        opacity: 0.6;
    }

	/* Frosted effect for locked days */
.day-box.locked {
    opacity: 0.45;
    filter: blur(1px);
    cursor: not-allowed;
    background: rgba(255, 255, 255, 0.20);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.25);
}

/* Unlocked days (normal) */
.day-box.unlocked {
    opacity: 1;
    filter: none;
    cursor: pointer;
}

</style>
</head>

<body>

<h1>Advent 2026</h1>

<div class="intro-verse">
    “The people who walked in darkness have seen a great light.” — Isaiah 9:2 (NKJV)
</div>

<div class="calendar-grid" id="calendar"></div>

<!-- Modal -->
<div id="verseModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-day"></h2>
        <p id="modal-text"></p>
    </div>
</div>

<!-- ✨ Advent Candles Footer Section -->
<div class="advent-candles">
    <div class="candle"><div id="candle1" class="flame"></div></div>
    <div class="candle"><div id="candle2" class="flame"></div></div>
    <div class="candle pink"><div id="candle3" class="flame"></div></div>
    <div class="candle"><div id="candle4" class="flame"></div></div>
</div>


<footer>
    Advent reflections © 2025–2026 KMT
</footer>

<!-- ✨ Sparkle Trail Script -->
<script>
document.addEventListener("mousemove", (event) => {
    for (let i = 0; i < 3; i++) {
        createSparkle(event.clientX, event.clientY);
    }
});

function createSparkle(x, y) {
    const s = document.createElement("div");
    s.classList.add("sparkle");

    const offsetX = (Math.random() - 0.5) * 20;
    const offsetY = (Math.random() - 0.5) * 20;

    s.style.left = x + offsetX + "px";
    s.style.top = y + offsetY + "px";

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 800);
}
</script>

<!-- 📖 Calendar Script -->
<script>

const verses = {
    1: `⭐“The voice of him that crieth in the wilderness, Prepare ye the way of the Lord, make straight in the desert a highway for our God.” — Isaiah 40:3–5 (KJV)`,

    2: `📜“Behold, the days come, saith the Lord, that I will perform that good thing which I have promised unto the house of Israel and to the house of Judah.” — Jeremiah 33:14–15 (KJV)`,

    3: `🕯️“O come, O come, Emmanuel, and ransom captive Israel, that mourns in lonely exile here, until the Son of God appear.” — *O Come, O Come, Emmanuel* (Public Domain)`,

    4: `✨“The people that walked in darkness have seen a great light.” — Isaiah 9:2 (KJV)`,

    5: `👼“Thou shalt call his name JESUS. He shall be great, and shall be called the Son of the Highest.” — Luke 1:30–33 (KJV)`,

    6: `🌿“And there shall come forth a rod out of the stem of Jesse… and the spirit of the Lord shall rest upon him.” — Isaiah 11:1–2 (KJV)`,

    7: `🔔“Hark! the herald angels sing, ‘Glory to the newborn King!’” — *Hark! The Herald Angels Sing*`,

    8: `🐑“Out of thee shall he come forth unto me that is to be ruler in Israel.” — Micah 5:2 (KJV)`,

    9: `🎵“Behold, a virgin shall be with child… and they shall call his name Emmanuel.” — Matthew 1:22–23 (KJV)`,

    10: `🎁“Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.” — Isaiah 7:14 (KJV)`,

    11: `🎶“Make a joyful noise unto the Lord, all the earth: make a loud noise, and rejoice, and sing praise.” — Psalm 98:4–6 (KJV)`,

    12: `❄️“Joy to the world! the Lord is come; let earth receive her King.” — *Joy to the World*`,

    13: `🎁“Behold, I will send my messenger, and he shall prepare the way before me.” — Malachi 3:1 (KJV)`,

    14: `📯“Behold, I bring you good tidings of great joy… For unto you is born this day in the city of David a Saviour, which is Christ the Lord.” — Luke 2:10–11 (KJV)`,

    15: `🧡“Rejoice greatly, O daughter of Zion; behold, thy King cometh unto thee.” — Zechariah 9:9 (KJV)`,

    16: `🌹“The desert shall rejoice, and blossom as the rose.” — Isaiah 35:1–2 (KJV)`,

    17: `🎼“O little town of Bethlehem, how still we see thee lie! Above thy deep and dreamless sleep the silent stars go by.” — *O Little Town of Bethlehem* (Public Domain)`,

    18: `🌌“In him was life; and the life was the light of men. And the light shineth in darkness.” — John 1:4–5 (KJV)`,

    19: `🙏“My soul doth magnify the Lord, and my spirit hath rejoiced in God my Saviour.” — Luke 1:46–49 (KJV)`,

    20: `🌄“How beautiful upon the mountains are the feet of him that bringeth good tidings.” — Isaiah 52:7 (KJV)`,

    21: `🔆“The Lord is my light and my salvation; whom shall I fear?” — Psalm 27:1 (KJV)`,

    22: `🕊️“For unto us a child is born, unto us a son is given…” — Isaiah 9:6 (KJV)`,

    23: `🎼“Silent night, holy night! All is calm, all is bright.” — *Silent Night* (Public Domain)`,

    24:  `✨👼🌟👼✨“And suddenly there was with the angel a multitude of the heavenly host praising God, and saying, Glory to God in the highest, and on earth peace, good will toward men.” — Luke 2:8–14 (KJV)`,

    25:`🎄👶🎄“And so it was, that, while they were there, the days were accomplished that she should be delivered. And she brought forth her firstborn son.” — Luke 2:4–7 (KJV)`
};



const grid = document.getElementById("calendar");
const today = new Date();
const preview = new URLSearchParams(window.location.search).get('preview') === '1';
const year = today.getFullYear();

// The four Sundays before Christmas, calculated for any year.
function firstSundayOfAdvent(y) {
    const christmas = new Date(y, 11, 25);
    const daysSinceSunday = christmas.getDay();
    const fourthSunday = new Date(y, 11, 25 - daysSinceSunday);
    return new Date(y, 11, fourthSunday.getDate() - 21);
}

// Preserve the original 25 December Scripture doors.
for (let day = 1; day <= 25; day++) {
    const box = document.createElement("div");
    box.classList.add("day-box");
    box.textContent = `Dec ${day}`;
    const openingDate = new Date(year, 11, day);
    const accessible = preview || today >= openingDate;
    box.classList.add(accessible ? "unlocked" : "locked");
    box.addEventListener("click", () => {
        if (accessible) openModal(day);
        else alert("No peeking! This day has not arrived yet!");
    });
    grid.appendChild(box);
}

function lightCandles() {
    const adventStart = firstSundayOfAdvent(year);
    for (let i = 0; i < 4; i++) {
        const candleDate = new Date(adventStart);
        candleDate.setDate(adventStart.getDate() + 7 * i);
        if (preview || today >= candleDate) {
            document.getElementById("candle" + (i + 1)).classList.add("lit");
        }
    }
}
lightCandles();

function openModal(day) {
    document.getElementById("modal-day").innerText = "🌲Day " + day +"🎀";
    document.getElementById("modal-text").innerHTML =
        verses[day] || "Verse coming soon...";
    document.getElementById("verseModal").style.display = "block";
}

function closeModal() {
    document.getElementById("verseModal").style.display = "none";
}

window.onclick = function(event) {
    const modal = document.getElementById("verseModal");
    if (event.target === modal) modal.style.display = "none";
};

</script>

</body>
</html>
